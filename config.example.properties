# Configuration locale (NE PAS publier sur GitHub : déjà listé dans .gitignore)
# Valeurs par défaut de XAMPP : utilisateur root, mot de passe vide.
db.url=jdbc:mysql://localhost:3306/gestion_ferroviaire?useSSL=false&serverTimezone=UTC
db.user=root
db.password=

# Thème : light | dark | system  (avec flatlaf-x.x.jar à la racine : rendu FlatLaf ; sinon : Nimbus aux couleurs de l'application)
ui.theme=light

# Affiche les comptes de démonstration sur l'écran de connexion (mettre false en "production")
ui.demo_hint=true
